---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: sriov-device-plugin
  namespace: {{.Namespace}}
  annotations:
    kubernetes.io/description: |
      This daemon set launches the SR-IOV network device plugin on each node.
    release.openshift.io/version: "{{.ReleaseVersion}}"
spec:
  selector:
    matchLabels:
      app: sriov-device-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 33%
  template:
    metadata:
      labels:
        app: sriov-device-plugin
        component: network
        type: infra
        openshift.io/component: network
    spec:
      hostNetwork: true
      nodeSelector:
        {{- range $key, $value := .NodeSelectorField }}
          {{ $key }}: "{{ $value }}"
        {{- end }}
      tolerations:
      - operator: Exists
      serviceAccountName: sriov-device-plugin
      priorityClassName: "system-node-critical"
      {{- if .ImagePullSecrets }}
      imagePullSecrets:
      {{- range .ImagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      initContainers:
      - name: wait-for-node-state
        image: {{.SRIOVNetworkConfigDaemonImage}}
        command: ["/bin/sh", "-c"]
        args:
        - |
          APISERVER=https://kubernetes.default.svc
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          echo "Waiting for SriovNetworkNodeState/${NODE_NAME} to be Succeeded..."
          while true; do
            STATUS=$(curl -sf --cacert "${CACERT}" \
              -H "Authorization: Bearer ${TOKEN}" \
              "${APISERVER}/apis/sriovnetwork.openshift.io/v1/namespaces/${NAMESPACE}/sriovnetworknodestates/${NODE_NAME}" \
              2>/dev/null | grep -o '"syncStatus":"[^"]*"' | cut -d'"' -f4)
            if [ "${STATUS}" = "Succeeded" ]; then
              echo "SriovNetworkNodeState/${NODE_NAME} is Succeeded, proceeding"
              exit 0
            fi
            echo "syncStatus='${STATUS}', retrying in 10s..."
            sleep 10
          done
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 10m
            memory: 10Mi
      containers:
      - name: sriov-device-plugin
        image: {{.SRIOVDevicePluginImage}}
        args:
        - --log-level=10
        - --resource-prefix={{.ResourcePrefix}}
        - --config-file=/etc/pcidp/$(NODE_NAME)
        {{- if .UseCDI }}
        - --use-cdi
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
        volumeMounts:
        - name: devicesock
          mountPath: /var/lib/kubelet/device-plugins
          readOnly: false
        - name: plugins-registry
          mountPath: /var/lib/kubelet/plugins_registry
          readOnly: false
        - name: config-volume
          mountPath: /etc/pcidp/
          readOnly: true
        - name: device-info
          mountPath: /var/run/k8s.cni.cncf.io/devinfo/dp
        {{- if .UseCDI }}
        - name: dynamic-cdi
          mountPath: /var/run/cdi
        {{- end }}
      volumes:
        - name: devicesock
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
        - name: config-volume
          configMap:
            name: device-plugin-config
        - name: device-info
          hostPath:
            path: /var/run/k8s.cni.cncf.io/devinfo/dp
            type: DirectoryOrCreate
        {{- if .UseCDI }}
        - name: dynamic-cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        {{- end }}
