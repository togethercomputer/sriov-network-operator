name: Test SR-IOV Operator

on: [push, pull_request]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  build:
    name: build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.26.10
      uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3
      with:
        go-version: 1.26.10

    - name: Check out code into the Go module directory
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: fmt
      run: IS_CONTAINER=yes make fmt

    - name: Build
      run: make all

  test:
    name: test
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.26.10
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
      with:
        go-version: 1.26.10

    - name: Check out code into the Go module directory
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: test pkg
      run: make test-pkg

    - name: test cmd
      run: make test-cmd

    - name: test api
      run: make test-api

    - name: test controllers on opensfhit
      run: CLUSTER_TYPE=openshift make test-controllers

    - name: test controllers on kubernetes
      run: CLUSTER_TYPE=kubernetes make test-controllers

    - name: test bindata/scripts
      run: make test-bindata-scripts

  modules:
    name: check go modules
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.26.10
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
      with:
        go-version: 1.26.10

    - name: Check out code into the Go module directory
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: check go modules are up to date
      run: make check-deps

  manifests:
    name: check manifests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: check if the config/ folder is up to date
      run: make check-manifests

  golangci:
    name: Golangci-lint
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.26.10
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
      with:
        go-version: 1.26.10
    - name: Check out code into the Go module directory
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
    - name: golangci-lint
      uses: golangci/golangci-lint-action@3a919529898de77ec3da873e3063ca4b10e7f5cc # v3
      with:
        # Required: the version of golangci-lint is required and must be specified without patch version: we always use the latest patch version.
        version: v1.55.2

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          severity: error

  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.26.10
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
      with:
        go-version: 1.26.10

    - name: Check out code into the Go module directory
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: test pkg
      run: make test-pkg

    - name: test cmd
      run: make test-cmd

    - name: test api
      run: make test-api

    - name: test controllers on opensfhit
      run: CLUSTER_TYPE=openshift make test-controllers

    - name: merge test coverage
      run: make merge-test-coverage

    - name: Coveralls
      uses: coverallsapp/github-action@9ba913c152ae4be1327bfb9085dc806cedb44057 # 1.1.3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: lcov.out

  virtual-k8s-cluster:
    name: k8s
    needs: [
      build,
      test,
      golangci,
    ]
    runs-on: [ sriov ]
    env:
      TEST_REPORT_PATH: k8s-artifacts
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Set up Go 1.26.10
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3
        with:
          go-version: 1.26.10

      - name: run test
        run: make test-e2e-conformance-virtual-k8s-cluster-ci

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: always()
        with:
          name: ${{ env.TEST_REPORT_PATH }}
          path: ./${{ env.TEST_REPORT_PATH }}

      - name: remove virtual cluster
        if: always()
        run: |
          kcli delete cluster $CLUSTER_NAME -y
          kcli delete network $CLUSTER_NAME -y

  virtual-ocp:
    name: ocp
    needs: [
      build,
      test,
      golangci,
    ]
    runs-on: [ ocp ]
    env:
      TEST_REPORT_PATH: ocp-artifacts
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Set up Go 1.26.10
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3
        with:
          go-version: 1.26.10

      - name: run test
        run: make test-e2e-conformance-virtual-ocp-cluster-ci

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: always()
        with:
          name: ${{ env.TEST_REPORT_PATH }}
          path: ./${{ env.TEST_REPORT_PATH }}

      - name: remove virtual cluster
        if: always()
        run: |
          kcli delete cluster $CLUSTER_NAME -y
          kcli delete network $CLUSTER_NAME -y
